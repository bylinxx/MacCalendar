name: Build and Release macOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: macos-latest
    
    # 授予 GitHub Token 读写代码库的权限，以支持自动提交和 Release
    permissions:
      contents: write

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 设置为0，以获取所有历史提交和Tag

      # 2. 自动生成自增 Tag
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch 
          tag_prefix: v       

      # 3. 修改 Xcode 项目文件中的版本号 (混合使用 sed 和 agvtool)
      - name: Update Xcode Project Version
        run: |
          RAW_TAG="${{ steps.tag_version.outputs.new_tag }}"
          APP_VERSION="${RAW_TAG#v}"
          BUILD_NUMBER="${{ github.run_number }}"
          
          # 1. 使用 sed 替换 pbxproj 中的 MARKETING_VERSION (对外版本号)
          sed -i '' -e 's/MARKETING_VERSION = .*/MARKETING_VERSION = '"$APP_VERSION"';/' "MacCalendar.xcodeproj/project.pbxproj"
          
          # 2. 内部 Build 号依然可以使用 agvtool 更新
          xcrun agvtool new-version -all "$BUILD_NUMBER"

      # 4. 修改后的版本号自动提交回 GitHub 仓库
      - name: Commit and Push changes
        run: |
          # 配置机器人的 Git 身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 暂存被修改的项目文件
          git add .
          
          # 检查是否有文件变动，如果有则提交
          if ! git diff-index --quiet HEAD; then
            # 必须包含 [skip ci]，否则会导致无限循环触发 Actions！
            git commit -m "chore: bump version to ${{ steps.tag_version.outputs.new_tag }} [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi

      # 5. 设置 Xcode 版本
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 6. 创建自签名证书并导入临时 Keychain
      - name: Create self-signed certificate and import to keychain
        run: |
          KEYCHAIN_PATH=$(pwd)/build.keychain-db
          KEYCHAIN_PASSWORD="buildpassword"
          P12_PASSWORD="p12password"
          
          # 创建临时 keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # 设置 keychain 为默认 keychain
          security default-keychain -s "$KEYCHAIN_PATH"
          
          # 解锁 keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # 设置 keychain 锁定超时为 3600 秒
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          
          # 使用 openssl 生成自签名证书
          openssl req -newkey rsa:2048 -nodes -keyout /tmp/build_key.pem -x509 -days 365 -out /tmp/build_cert.pem \
            -subj "/CN=MacCalendar Developer/O=MacCalendar/OU=B7NL26JPVD"
          
          # 转换为 p12 格式
          openssl pkcs12 -export -legacy -inkey /tmp/build_key.pem -in /tmp/build_cert.pem -out /tmp/build_certificate.p12 -passout pass:"$P12_PASSWORD"
          
          # 导入证书到 keychain
          security import /tmp/build_certificate.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          
          # 设置 ACL
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # 7. 编译 SwiftUI 应用程序
      - name: Build SwiftUI App
        run: |
          xcodebuild clean build \
            -project "MacCalendar.xcodeproj" \
            -scheme "MacCalendar" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENTITLEMENTS_REQUIRED=YES \
            SYMROOT=$(pwd)/build \
            OBJROOT=$(pwd)/build

      - name: Manually sign App and Extension with Entitlements
        run: |
          WIDGET_ENTITLEMENTS="MacCalendarWidget/MacCalendarWidgetExtension.entitlements"
          APP_ENTITLEMENTS="MacCalendar/MacCalendar.entitlements"
          
          WIDGET_PATH="build/Release/MacCalendar.app/Contents/PlugIns/MacCalendarWidgetExtension.appex"
          APP_PATH="build/Release/MacCalendar.app"
          
          codesign --force --deep --sign "MacCalendar Developer" \
            --entitlements "$WIDGET_ENTITLEMENTS" \
            --options runtime \
            "$WIDGET_PATH"
          
          codesign --force --deep --sign "MacCalendar Developer" \
            --entitlements "$APP_ENTITLEMENTS" \
            --options runtime \
            "$APP_PATH"

      # 8. 验证签名和 App Group 权限
      - name: Verify code signing and entitlements
        run: |
          echo "=== Main App Signing Info ==="
          codesign -d --entitlements - build/Release/MacCalendar.app
          
          echo ""
          echo "=== Widget Extension Signing Info ==="
          codesign -d --entitlements - build/Release/MacCalendar.app/Contents/PlugIns/MacCalendarWidgetExtension.appex

      # 9. 清理临时 Keychain
      - name: Cleanup temporary keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$(pwd)/build.keychain-db
          security delete-keychain "$KEYCHAIN_PATH" 2>&1 || true

      # 10. 安装打包工具 create-dmg
      - name: Install create-dmg
        run: brew install create-dmg

      # 11. 打包成 DMG 文件
      - name: Create DMG package
        run: |
          mkdir -p dmg_source
          cp -r build/Release/MacCalendar.app dmg_source/
          
          create-dmg \
            --volname "MacCalendar Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "MacCalendar.app" 150 120 \
            --hide-extension "MacCalendar.app" \
            --app-drop-link 450 120 \
            "MacCalendar.dmg" \
            "dmg_source/"

      # 12. 创建 GitHub Release 并上传 DMG
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MacCalendar.dmg
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: "Release ${{ steps.tag_version.outputs.new_tag }}"
          body: "此版本由 GitHub Actions 自动编译和发布。\n\n包含的更新:\n${{ steps.tag_version.outputs.changelog }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}